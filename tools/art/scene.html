<svg id="a" xmlns="http://www.w3.org/2000/svg"></svg>

const D=__DATA__;const NS='http://www.w3.org/2000/svg';const svg=document.getElementById('a');

function rng(seed){let a=seed*2654435761>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(D.seed||1);

    for(let i=0;i<L.length-1;i++)L[i][1].forEach(a=>L[i+1][1].forEach(b=>ln(L[i][0],c+a,L[i+1][0],c+b,WH,.14,1)));
    const hot=[[1,1],[2,2],[3,0]];
    for(let i=0;i<L.length-1;i++){}
    ln(L[0][0],c-37,L[1][0],c-75,AC,.9,2.2);ln(L[1][0],c-75,L[2][0],c,AC,.9,2.2);ln(L[2][0],c,L[3][0],c-75,AC,.9,2.2);
    L.forEach((l,i)=>l[1].forEach(a=>ci(l[0],c+a,13,WH,.7,1.6,BG)));
    [[0,-37],[1,-75],[2,0],[3,-75]].forEach(([i,a])=>ci(L[i][0],c+a,13,AC,1,0,AC));
  }
  if(K==='security'){
    const hex=(r,rot)=>Array.from({length:6},(_,i)=>{const a=Math.PI/3*i+rot;return[c+Math.cos(a)*r,c+Math.sin(a)*r]});
    [170,125,80].forEach((r,i)=>el('polygon',{points:hex(r,Math.PI/6).map(p=>p.join(',')).join(' '),fill:'none',stroke:i==0?AC:WH,'stroke-opacity':i==0?1:.28,'stroke-width':i==0?2.4:1.3}));
    ci(c,c-18,26,AC,1,3);rc(c-34,c-6,68,54,AC,1,3,6,BG);ln(c,c+12,c,c+30,AC,1,3);
    for(let k=0;k<9;k++)ln(c-170,c-150+k*34,c-170+30+R()*50,c-150+k*34,WH,.18,1.4);
  }
  if(K==='defense'){
    [60,110,160].forEach(r=>ci(c,c,r,WH,.22,1.2));
    for(let i=0;i<72;i++){const a=i*Math.PI/36,l=i%6==0?22:10;ln(c+Math.cos(a)*172,c+Math.sin(a)*172,c+Math.cos(a)*(172-l),c+Math.sin(a)*(172-l),WH,i%6==0?.5:.22,1.2)}
    ln(c-175,c,c+175,c,WH,.14);ln(c,c-175,c,c+175,WH,.14);
    // sweep wedge
    const a0=-Math.PI/2.8,a1=-Math.PI/6;el('path',{d:`M${c} ${c} L ${c+Math.cos(a0)*160} ${c+Math.sin(a0)*160} A 160 160 0 0 1 ${c+Math.cos(a1)*160} ${c+Math.sin(a1)*160} Z`,fill:AC,'fill-opacity':.16,stroke:AC,'stroke-opacity':.9,'stroke-width':1.6});

  }
  if(K==='robotics'){

    el('path',{d:`M${j1[0]} ${j1[1]-68} A 68 68 0 0 1 ${j1[0]+60} ${j1[1]-32}`,fill:'none',stroke:WH,'stroke-opacity':.35,'stroke-dasharray':'3 6'});

// ---------- HERO BACKGROUND PLATES (dark, quiet) ----------
if(D.mode==='bg'){
  if(K==='contour'){
    const cols=160,rows=Math.round(cols*H/W),f=[];const ph=[R()*9,R()*9,R()*9,R()*9];
    const val=(x,y)=>Math.sin(x*1.7+ph[0])*.5+Math.sin(y*2.3+ph[1])*.45+Math.sin((x+y)*3.1+ph[2])*.28+Math.sin(Math.hypot(x-1.4,y-.9)*5+ph[3])*.5;
    for(let j=0;j<=rows;j++){f[j]=[];for(let i=0;i<=cols;i++)f[j][i]=val(i/cols*3.2,j/rows*1.8)}
    const sx=W/cols,sy=H/rows;
    for(let L=-1.9;L<=1.9;L+=.13){
      const major=Math.abs(Math.round(L/.13))%5==0,segs=[];
      for(let j=0;j<rows;j++)for(let i=0;i<cols;i++){
        const a=f[j][i],b=f[j][i+1],c2=f[j+1][i+1],d=f[j+1][i];
        const idx=(a>L)*8+(b>L)*4+(c2>L)*2+(d>L)*1;if(idx==0||idx==15)continue;
        const lerp=(p,q)=>(L-p)/(q-p);
        const T=[i+lerp(a,b),j],Rr=[i+1,j+lerp(b,c2)],B=[i+lerp(d,c2),j+1],Lf=[i,j+lerp(a,d)];
        const m={1:[Lf,B],2:[B,Rr],3:[Lf,Rr],4:[T,Rr],5:[T,Lf,B,Rr],6:[T,B],7:[T,Lf],8:[T,Lf],9:[T,B],10:[T,Rr,Lf,B],11:[T,Rr],12:[Lf,Rr],13:[B,Rr],14:[Lf,B]}[idx];
        if(m.length==2)segs.push(m);else{segs.push([m[0],m[1]]);segs.push([m[2],m[3]])}
      }
      const d=segs.map(([p,q])=>`M${(p[0]*sx).toFixed(1)} ${(p[1]*sy).toFixed(1)}L${(q[0]*sx).toFixed(1)} ${(q[1]*sy).toFixed(1)}`).join('');
      el('path',{d,fill:'none',stroke:major?'#d9a07a':'#8f8a84','stroke-opacity':major?.5:.2,'stroke-width':major?1.5:1});
    }
  }
  if(K==='plate'){
    for(let x=0;x<=W;x+=80){ln(x,0,x,H,'#cfc8c0',x%400==0?.12:.05)}for(let y=0;y<=H;y+=80){ln(0,y,W,y,'#cfc8c0',y%400==0?.12:.05)}
    for(let x=0;x<=W;x+=400)for(let y=0;y<=H;y+=400){ln(x-9,y,x+9,y,AC,.8,1.4);ln(x,y-9,x,y+9,AC,.8,1.4)}

  }
}
